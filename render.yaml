# Render Blueprint: deploys the FastAPI backend as a free web service.
# On render.com: New → Blueprint → pick this repo. Secrets marked `sync: false`
# are typed in by hand on the Render dashboard (never committed).
services:
  - type: web
    name: hiremate-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_FALLBACK_MODEL
        value: gemini-3.1-flash-lite
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_PER_DAY
        value: "10"
